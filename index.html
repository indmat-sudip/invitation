<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wedding Invitation · শুভ বিবাহ</title>
  <meta name="description"
    content="You are invited to our wedding. Tap to open your invitation. · আপনি আমাদের শুভ বিবাহে আমন্ত্রিত।">
  <meta name="theme-color" content="#7a0f1e">
  <meta property="og:title" content="You're invited · আপনি আমন্ত্রিত">
  <meta property="og:description" content="Tap to open your wedding invitation.">
  <meta property="og:type" content="website">
  <!-- After deploying, add: <meta property="og:image" content="https://YOUR-USERNAME.github.io/REPO/photos/preview.jpg"> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Noto+Serif+Bengali:wght@400;600&family=Tiro+Bangla:ital@0;1&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="locked">

  <!-- decorative symbols are generated by script.js into this element -->
  <svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

  <!-- language switch -->
  <div id="langSw" role="group" aria-label="Language">
    <button type="button" data-l="en">EN</button><button type="button" data-l="bn">বাং</button>
  </div>

  <!-- envelope -->
  <div id="intro" role="button" tabindex="0" aria-label="Open the invitation">
    <div id="introInner"></div>
  </div>

  <main id="app"></main>

  <canvas id="petals" aria-hidden="true"></canvas>
  <button id="music" class="music" type="button" aria-label="Music on/off" hidden>♪</button>
  <audio id="bgm" loop preload="none"></audio>
  <div id="lb" hidden><img alt=""></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>

</html>
